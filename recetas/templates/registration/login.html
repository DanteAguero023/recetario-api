{% extends "base.html" %}
{% block title %}Ingresar{% endblock %}
{% block content %}
<div class="card form-card aparece">
  <h1>Ingresar</h1>
  <p class="muted">Bienvenido de vuelta a tu recetario.</p>
  <form method="post" data-splash-reset>
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <div class="acciones">
      <button class="btn" type="submit">Entrar</button>
      <a class="btn btn-sec" href="{% url 'recetas:registro' %}">Crear cuenta</a>
    </div>
  </form>
</div>
{% endblock %}
