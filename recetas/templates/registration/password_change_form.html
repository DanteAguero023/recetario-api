{% extends "base.html" %}
{% block title %}Cambiar contraseña{% endblock %}
{% block content %}
<div class="card form-card aparece">
  <h1>Cambiar contraseña</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="acciones">
      <button class="btn" type="submit">Guardar</button>
      <a class="btn btn-sec" href="{% url 'recetas:configuracion' %}">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
