{% extends "base.html" %}
{% block title %}Borrar receta{% endblock %}
{% block content %}
<div class="card form-card aparece" style="text-align:center">
  <span class="emoji" style="font-size:3rem">🗑️</span>
  <h1>¿Borrar "{{ object.titulo }}"?</h1>
  <p class="muted">Esta acción no se puede deshacer.</p>
  <form method="post">
    {% csrf_token %}
    <div class="acciones" style="justify-content:center">
      <button class="btn btn-peligro" type="submit">Sí, borrar</button>
      <a class="btn btn-sec" href="{% url 'recetas:detalle' object.pk %}">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
